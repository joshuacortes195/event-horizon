<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event Horizon</title>
    <meta name="description" content="A real-time black hole renderer. Light bends around a non-spinning black hole, traced live on your GPU with WebGL2." />
    <meta name="theme-color" content="#000000" />
    <!-- what a shared link shows: title, one line and a picture of the default view -->
    <meta property="og:title" content="Event Horizon" />
    <meta property="og:description" content="A real-time black hole renderer. Light bends around a non-spinning black hole, traced live on your GPU with WebGL2." />
    <meta property="og:image" content="https://joshuacortes195.github.io/event-horizon/preview.png" />
    <meta property="og:url" content="https://joshuacortes195.github.io/event-horizon/" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- tiny black hole icon drawn inline, so there's no favicon file to fetch -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='none' stroke='%23f2b56b' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='9' fill='%23000'/%3E%3C/svg%3E" />
    <style>
      /* colors used everywhere on the page */
      :root {
        --ink: #e8e6e3;
        --muted: #9a968f;
        --accent: #f2b56b;
        --glass: rgba(12, 12, 16, 0.82);
        --line: rgba(255, 255, 255, 0.08);
      }

      /* full screen black page with the canvas filling it */
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      body { color: var(--ink); font: 13px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; }

      /* amber ring on whatever the keyboard is on */
      :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

      /* name, what it is and how to move, top left over the stars */
      .intro {
        position: fixed; top: 20px; left: 20px; max-width: 320px;
        text-shadow: 0 0 14px rgba(0, 0, 0, 0.95), 0 1px 3px #000, 0 0 1px #000; pointer-events: none;
      }
      .intro h1 { margin: 0 0 4px; font-size: 13px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; }
      .intro p { margin: 0 0 2px; color: #c9c5bf; }
      .intro .how { color: var(--muted); }
      .intro .stats { margin-top: 8px; color: var(--accent); font-variant-numeric: tabular-nums; min-height: 1.4em; }
      .intro a { pointer-events: auto; color: var(--ink); text-underline-offset: 3px; text-decoration-color: rgba(255, 255, 255, 0.35); }
      .intro a:hover { text-decoration-color: var(--accent); }
      .touch-only { display: none; }
      @media (pointer: coarse) { .touch-only { display: inline; } .mouse-only { display: none; } }

      /* control panel on the right, see through so the black hole still shows behind it */
      .panel {
        position: fixed; top: 12px; right: 12px; width: 280px; max-height: calc(100% - 24px);
        display: flex; flex-direction: column;
        background: var(--glass); border: 1px solid var(--line);
        border-radius: 12px; backdrop-filter: blur(8px);
      }
      .panel:not(.open) { width: auto; }
      .panel:not(.open) .body, .panel:not(.open) .reset { display: none; }

      /* top row of the panel: the show and hide button, and reset */
      .bar { display: flex; align-items: center; }
      .handle {
        flex: 1; display: flex; align-items: center; justify-content: space-between; gap: 12px;
        background: none; border: 0; color: inherit; font: inherit; font-weight: 600;
        padding: 10px 14px; text-align: left; cursor: pointer; border-radius: 12px;
      }
      .handle svg { width: 12px; height: 12px; color: var(--muted); transition: transform 0.2s ease; }
      .panel.open .handle svg { transform: rotate(180deg); }
      .reset {
        margin-right: 8px; padding: 4px 8px; border-radius: 6px; cursor: pointer; font: inherit; font-size: 12px;
        background: none; border: 0; color: var(--muted);
      }
      .reset:hover { color: var(--ink); background: rgba(255, 255, 255, 0.06); }
      .body { overflow-y: auto; min-height: 0; padding: 0 14px 14px; }

      /* one group of controls with a small heading */
      section { padding: 10px 0; border-top: 1px solid var(--line); }
      h2 { margin: 0 0 8px; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }

      /* slider rows: name on the left, value on the right, the slider under them */
      .row { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; margin-bottom: 8px; }
      .row .value { color: var(--accent); font-variant-numeric: tabular-nums; }
      .row input { grid-column: 1 / -1; width: 100%; margin: 0; accent-color: var(--accent); }

      /* checkbox rows with an optional gray hint under the name, grayed out when the disk is off */
      .toggle { display: grid; grid-template-columns: auto 1fr; gap: 0 8px; align-items: baseline; margin-bottom: 7px; cursor: pointer; }
      .toggle input { accent-color: var(--accent); margin: 0; align-self: center; }
      .toggle .hint { grid-column: 2; font-size: 11.5px; color: var(--muted); }
      .toggle.off, .row.off { opacity: 0.4; cursor: default; }

      /* the three preset buttons in a row, the one matching the view is lit up */
      .presets { display: flex; gap: 6px; }
      .presets button {
        flex: 1; padding: 7px 4px; border-radius: 8px; cursor: pointer; font: inherit;
        background: rgba(255, 255, 255, 0.06); color: inherit; border: 1px solid rgba(255, 255, 255, 0.12);
        transition: background 0.15s ease, border-color 0.15s ease;
      }
      .presets button:hover { background: rgba(255, 255, 255, 0.12); }
      .presets button[aria-pressed='true'] { border-color: var(--accent); color: var(--accent); background: rgba(242, 181, 107, 0.1); }

      /* phones: the intro gets smaller and the panel becomes a sheet along the bottom */
      @media (max-width: 700px) {
        .intro { top: 14px; left: 16px; right: 16px; font-size: 12px; }
        .intro .what { display: none; }
        .panel { top: auto; left: 0; right: 0; bottom: 0; width: auto; max-height: 60vh; border-radius: 12px 12px 0 0; }
        .handle { justify-content: center; padding: 12px; }
      }

      /* no spinning chevron for people who turned motion off */
      @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <!-- only shown on the live page, the test and bench pages leave it hidden -->
    <header class="intro" hidden>
      <h1>Event Horizon</h1>
      <p class="what">Light bending around a non-spinning black hole, traced live on your GPU.</p>
      <p class="how"><span class="mouse-only">Drag to orbit, scroll to zoom</span><span class="touch-only">Drag to orbit, pinch to zoom</span></p>
      <p class="stats" id="stats"></p>
      <p><a href="https://github.com/joshuacortes195/event-horizon">How it works and the code</a></p>
    </header>
    <div id="panel"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
